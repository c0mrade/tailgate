# Tooling only. No [project] table on purpose: Hermes installs a plugin's [project].dependencies,
# and tailgate needs nothing beyond the standard library.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]  # small lambdas in tests read fine
