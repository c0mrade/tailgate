# Runs lint and the test suite on every pull request and on every push to main.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Python version Hermes supports (requires-python >=3.11,<3.14).
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
